<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)" >
<head>
<meta charset="UTF-8">
<title>My Shopping Web</title>
<link rel="stylesheet"
      th:href="@{/bootstrap/bootstrap-5.2.3-dist/css/bootstrap.min.css}">
      
      <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}"/>
      
      
      
      <style>
* {
	box-sizing: 0;
	margin: 0;
	padding: 0;
}

    nav {
	background-color:green;
	padding:5px;
}

nav .nav-link {
	color: white;
}


</style>
  

</head>
<body class="d-flex flex-column min-vh-100">

<!--NavBar-->
<div th:replace="~{fragments/navbar::navbar}"></div>

<!-- Content -->
<main class="flex-fill" style="margin-top: 150px;">
<div th:replace="${content}"></div>

</main>
<div th:replace="~{fragments/footer::footer}"></div>

</body>
<script th:src="@{/bootstrap/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/fontawesome/js/all.min.js}"></script>

</html>
