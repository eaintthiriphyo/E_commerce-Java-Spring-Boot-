<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout::layout(~{::section})}">

<body>

	<section>


	<div class="container">
			<form class="d-flex col-6" role="search" th:action="@{/myshop/searchProducts}" method="get">
				<div class="input-group">
					<input class="form-control me-2" type="search"
						placeholder="Search Product" aria-label="Search" name="keyword" th:value="${keyword}"/>
					<button class="btn btn-primary" type="submit">Search</button>
				</div>
			</form>
		</div>
		

		<!--Product-->
		<div class="container-fluid bg-light p-3">
			<div class="row">
				<div class="col-md-3">

					<div class="card p-3 mt-5">
						<h4 class="text-center">Category List</h4>
						<div class="list-group my-3">
							<a class="list-group-item active"
   aria-current="true"
   th:href="@{/myshop/product}">
   All Categories
</a>

<th:block th:each="c : ${catList}">
    <a class="list-group-item"
       th:href="@{'/myshop/product?category=' + ${c.title}}">
        [[${c.title}]]
    </a>
</th:block>




						</div>
					</div>
				</div>
				<div class="col-md-8">
					<div class="row">
						<h3 class="text-center my-3 fw-bold">Products</h3>
						<div th:if="${#lists.isEmpty(products)}">
							<h3 class="text-center text-danger">Products Are Not
								Avaliable</h3>
						</div>
						<div>

							<div class="row">
								<div class="col-md-3 my-2" th:if="@{!#lists.isEmpty(products)}"
									th:each="p:${products}">
									<div class="card shadow-lg h-100 ">

										<div class="card-body text-center">
											<img
												th:src="@{'/uploads/product_img/' + ${p.image}}"
												class="card-img-top " width="100%" height="180px">
											<p>[[${p.name}]]</p>
											<p>
												<span>[[${p.discountPrice}]] </span><br> <span
													class="text-decoration-line-through text-secondary">[[${p.price}]]
												</span> kyats <span class="text-danger">[[${p.discount}]]%
													off</span>
											</p>
											<a th:href="@{/myshop/user/viewProduct/{id}(id=${p.id})}">
<button class="btn text-white " style="background-color: #006400;">
    View Details
</button>
											</a>
										</div>

									</div>

								</div>
							</div>

						</div>
					</div>
				</div>
			</div>
		</div>



	</section>
</body>
<script
	th:src="@{/bootstrap/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>

</html>
