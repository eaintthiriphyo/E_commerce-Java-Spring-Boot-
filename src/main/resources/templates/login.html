<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"  th:replace="~{layout::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<link rel="stylesheet" th:href="@{/bootstrap/bootstrap-5.2.3-dist/css/bootstrap.min.css}"/>

</head>
<body>

<section>

<div  class="mx-auto card col-md-4 pb-5 pt-3 px-3 shadow-md">
<h3 class="text-center mb-4">Login</h3>

<div class="">
 <div th:if=${param.error} class="alert alert-danger"><p>Invalid Email & Password</p></div>
  <div th:if=${param.logout} class="alert alert-success"><p>Logout Successful</p></div>
 
  </div>
 
<form th:action="@{/login}" method="post">
 
  
  <div class="">
    <label for="inputEmail4" class="form-label" required>Email Address</label>
<input type="email" class="form-control" id="email" name="username" required>
  </div>
 
  <div class="">
    <label for="inputPassword" class="form-label" required>Password</label>
<input type="password" class="form-control" id="password4" name="password" required>
  </div>
    
 

<div>
    <button type="submit" class="btn  btn-large text-white col-12 mt-5"  style="background-color: #006400;">Login</button>

</div>    

</form>

<div class="text-center"><a href="#">Forget Password?</a></div>
<div class="text-center">Don't Have an account?<a href="/myshop/register">Sing Up</a></div>

</div>

</section>
</body>
<script th:src="@{/bootstrap/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>

</html>
