<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout::layout(~{::section})}">

<body>
	<section>
		<div class="container mx-auto mt-5">


			<div class="row">
				<div class="col-md-4  p-3">

					<form
						th:action="${role == 'ROLE_ADMIN'} ? 
                @{/myshop/admin/changePassword} : 
                @{/myshop/user/changePassword}"
						method="post" class="card p-3">
						<div th:if="${session.succPassMessage}"
							class="alert alert-success">[[${session.succPassMessage}]]
						</div>

						<div th:if="${session.errPassMessage}" class="alert alert-danger">
							[[${session.errPassMessage}]]</div>

						<h3 class="text-center my-3">Change Password</h3>

						<input type="hidden" name="" id> <label>New
							Password</label> <input type="password" class="form-control"
							name="newPassword"> <label>Old Password</label> <input
							type="password" class="form-control" name="oldPassword">
						<button type="submit" class="btn btn-success col-12 my-3">Change
							Password</button>
					</form>


				</div>
				<div class="col-md-6">
					<div class="card shadow-md ">
						<form
							th:action="${role == 'ROLE_ADMIN'} ? 
                @{/myshop/admin/updateProfile} : 
                @{/myshop/user/updateProfile}"
							method="post" enctype="multipart/form-data" class="row p-3">
							
							<h2 class="text-center">Profile Detail</h2>

							<div class="text-center mt-3">
								<img th:src="@{'/uploads/user_img/' + ${user.image}}"
									width="100" height="100">

								<p th:text="${user.image}"></p>
							</div>
							<div class="col-md-12">
								<label for="inputName" class="form-label">Full Name</label> <input
									type="text" class="form-control" id="username" name="name"
									th:value="${user.name}" required>
							</div>
							<div class="col-md-12">
								<label for="inputPhone" class="form-label">Mobile Number</label>
								<input type="text" class="form-control" id="phone" name="phone"
									th:value="${user.phone}" required>
							</div>

							<div class="col-md-12">
								<label for="inputEmail4" class="form-label">Address</label> <input
									type="text" class="form-control" id="inputEmail4"
									name="address" th:value="${user.address}" required>
							</div>




							<div class="col-md-6">
								<label for="inputCity" class="form-label">City</label> <input
									type="text" class="form-control" id="city" name="city"
									placeholder="Yangon" th:value="${user.city}" required>
							</div>
							<div class="col-md-6">
								<label for="inputState" class="form-label">State</label> <input
									type="text" class="form-control" id="state"
									th:value="${user.state}" placeholder="Yangon" name="state">
							</div>

							<div class="col-md-12">
								<label for="profile" class="form-label">Profile Image</label> <input
									type="file" class="form-control" id="profile" name="file">
							</div>

							<button type="submit" class="btn btn-success col-12 my-3">Update</button>
						</form>
					</div>
				</div>


			</div>
		</div>
	</section>
</body>
</html>
