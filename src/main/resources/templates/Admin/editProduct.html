<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout::layout(~{::section})}">

<section>

<div class="col-md-5 card shadow-md p-5 mx-auto">
		<a th:href="@{/myshop/admin/viewProduct}" ><button class="btn btn-success mb-3">view product</button></a>

    <h2 class="text-center">Edit Product</h2>
    
    <form th:action="@{/myshop/admin/updateProduct}" 
          th:object="${product}" 
          method="post" 
          enctype="multipart/form-data">

	    <input type="hidden" name="id" th:value="${product.id}">


        <div class="mb-3">
            <label for="name" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${product.name}">
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" 
                      id="description" 

						name="description"
						th:text="${product.description}"
                      rows="4" 
                      placeholder="Enter product description"></textarea>
        </div>

        <!-- Category -->
        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-control" name="category">
            <option  th:value="${product.category.id}" th:text="${product.category.title}" ></option>
            
                <option th:each="c:${catList}"
                th:value="${c.id}"
                th:text="${c.title}">
                </option>
                
                
            </select>
        </div>

        <!-- Price -->
        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="text" class="form-control" id="price" name="price" th:value="${product.price}">
        </div>

        <!-- Stock -->
        <div class="mb-3">
            <label for="stock" class="form-label">Stock</label>
            <input type="text" class="form-control" id="stock" name="stock" th:value="${product.stock}">
        </div>

       

        
        <div class="mb-3">
            <label for="image" class="form-label">Image</label>
            <input type="file" class="form-control" id="image" name="file" >
        </div>
        
       <div class="text-center mt-3">
 <img th:src="@{'/uploads/product_img/' + ${product.image}}" width="100" height="100">
						<p th:text="${product.image}"></p>
				</div>

        <!-- Submit Button -->
        <div class="mt-4">
            <button type="submit" class="btn text-white col-12" style="background-color: #006400;">Save</button>
        </div>
        
    </form>
</div>

</section>
</html>
