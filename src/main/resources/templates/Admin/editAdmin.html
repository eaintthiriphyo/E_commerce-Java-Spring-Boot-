<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout::layout(~{::section})}">

<body>
<section>



<div class="col-md-4 mx-auto  card shadow-md p-3">
<h2 class="text-center">Edit Admin</h2>
	<form th:action="@{/myshop/admin/saveAdmin}" method="post" th:object="${admin}">
    <input type="hidden" th:field="*{id}">

    <label>Name</label>
    <input type="text" class="form-control" th:field="*{name}">

    <label>Email</label>
    <input type="email" class="form-control" th:field="*{username}">

    <label>Phone</label>
    <input type="text" class="form-control" th:field="*{phone}">

    <label>Address</label>
    <input type="text" class="form-control" th:field="*{address}">

    <button type="submit" class="btn text-white col-12 my-3" style="background-color: #006400;">Save</button>
</form>
</div>
</section>
</body>
</html>
