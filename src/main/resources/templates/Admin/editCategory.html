<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout::layout(~{::section})}">

<body>
	<section>



		<div class="col-md-4 mx-auto  card shadow-md p-3">
	<a th:href="@{/myshop/admin/category}"><button class="btn btn-success">Back</button></a>

			<h2 class="text-center">Edit Category</h2>
			<form th:action="@{/myshop/admin/updateCategory}" method="post" enctype="multipart/form-data">

				<input type="hidden" class="form-control" id="id" name="id" th:value="${category.id}">


				<div class="">
					<label for="Title" class="form-label">Title</label> <input
						type="text" class="form-control" id="title" name="title"
						th:value="${category.title}">

				</div>

				<div class="">
					<label for="Image" class="form-label">Image</label> <input
						type="file" class="form-control" id="image" name="file">
						


				</div>
				<div class="text-center mt-3">
				 <img th:src="@{'/uploads/category_img/' + ${category.image}}" width="100" height="100">

						<p th:text="${category.image}"></p>
				</div>

				<div>
					<button type="submit"
						class="btn  btn-large text-white col-12 my-3" style="background-color: #006400;">Save
						Change</button>

				</div>

			</form>
		</div>
	</section>
</body>
</html>
