<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout::layout(~{::section})}">

<section>

<div class="col-md-5 card shadow-md p-5 mx-auto">
    	<a th:href="@{/myshop/admin/viewProduct}"><button class="btn btn-success mb-3">Back</button></a>

    <h2 class="text-center">Add Discount</h2>
    
    <form th:action="@{/myshop/admin/addDiscount}" 
          th:object="${product}" 
          method="post" 
          enctype="multipart/form-data">

	    <input type="hidden" name="id" th:value="${product.id}">


        <div class="mb-3">
            <label for="name" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${product.name}">
        </div>

       
        
        <!-- Price -->
        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="text" class="form-control" id="price" name="price" th:value="${product.price}">
        </div>

      
       <!-- Discount -->
        <div class="mb-3">
            <label for="price" class="form-label">Discount (%)</label>
            <input type="text" class="form-control" id="price" name="discount" th:value="${product.discount}">
        </div>
    

        <!-- Submit Button -->
        <div class="mt-4">
            <button type="submit" class="btn text-white col-12" style="background-color: #006400;">Save</button>
        </div>
        
    </form>
</div>

</section>
</html>
