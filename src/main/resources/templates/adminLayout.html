<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)" >
<head>
<meta charset="UTF-8">
<title>My Shopping Web</title>
<link rel="stylesheet"
      th:href="@{/bootstrap/bootstrap-5.2.3-dist/css/bootstrap.min.css}">
      
      <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}"/>
      
      
      <style>
* {
	box-sizing: 0;
	margin: 0;
	padding: 0;
}

    nav {

	color: white;
}


</style>
  

</head>
<body>

<div th:replace="~{fragments/adminNavbar::navbar}"></div>

<!-- Content -->
<main style="margin-top: 100px;">
<div th:replace="${content}"></div>

</main>
</body>
<script th:src="@{/bootstrap/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>
